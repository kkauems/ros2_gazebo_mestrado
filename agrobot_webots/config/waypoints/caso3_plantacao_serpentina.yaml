# Caso de estudo 3: serpentina longa na plantação (plantation_field.wbt), ~51 m.
# Entrelinha y = 0 para leste, y = 1,8 para oeste, travessia da cabeceira
# oeste, y = -1,8 para leste e volta pela y = 0 para oeste até a partida.
# Percurso longo (deriva acumulada), entrelinhas iguais (aliasing) e a
# entrelinha do meio percorrida duas vezes, em sentidos opostos (o SLAM e o
# VSLAM podem fechar o laço nela).
#
# Mesmas coordenadas e obstáculos do caso 2 (veja caso2_plantacao_ida_volta.yaml).
# Os pontos no meio das entrelinhas (x = 6) obrigam o Nav2 a usar a
# entrelinha certa (sem eles ele pode voltar por outra) e servem de pontos
# de coleta.
#
# Cabeceira leste da entrelinha -1,8: a pedra grande em (11,8; -1,5) fica
# logo na saída da entrelinha. Entre ela e o fim da fileira y = -0,9 sobra
# ~1,1 m (o robô tem 1,12 m de largura), então não dá para subir direto
# para a y = 0; os dois caminhos possíveis passam por vãos de ~1,5 m: ao sul
# da pedra (até o fim da fileira y = -2,7) e a leste dela (até o mourão da
# cerca). Antes, o waypoint ficava no bolsão em (10,8; -1,8), o robô chegava
# olhando para o nordeste (para a pedra) e não conseguia girar ali: o Nav2
# desistia ("Failed to create plan" ou "Collision Ahead - Exiting Spin") e
# perdia esse waypoint e o seguinte. Agora o robô sai da entrelinha em
# diagonal pelo vão sul até contorno_pedra_sul, onde há folga para girar
# (~1 m da pedra e do fim da fileira), olhando para o vão leste (yaw 0,7),
# e de lá o Nav2 contorna a pedra pelo leste até a entrelinha y = 0.
#
# Na cabeceira oeste o ponto da y = 1,8 fica em x = 0,8: em x = 0,6 a quina
# do robô passava a ~4 cm da pedra em (-0,3; 2,4) ao girar para o sul, e a
# checagem dos waypoints (waypoint_check.py, folga de 5 cm) recusava o ponto.
world: plantation_field.wbt
waypoints:
  - {name: meio_y0, x: 6.0, y: 0.0}
  - {name: cabeceira_leste_y0, x: 11.3, y: 0.0}
  - {name: cabeceira_leste_y1.8, x: 11.3, y: 1.8}
  - {name: meio_y1.8, x: 6.0, y: 1.8}
  - {name: cabeceira_oeste_y1.8, x: 0.8, y: 1.8}
  - {name: cabeceira_oeste_y-1.8, x: 0.6, y: -1.8}
  - {name: meio_y-1.8, x: 6.0, y: -1.8}
  - {name: contorno_pedra_sul, x: 11.6, y: -2.85, yaw: 0.7}
  - {name: cabeceira_leste_y0_volta, x: 11.3, y: 0.0}
  - {name: meio_y0_volta, x: 6.0, y: 0.0}
  - {name: partida, x: 0.0, y: 0.0}
