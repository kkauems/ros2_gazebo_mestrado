# Caso de estudo 4: ida e volta no olival (olive_grove.wbt), ~160 m.
# Entrelinha y = 0 até a cabeceira leste, entrelinha y = 7 de volta e retorno
# à partida. Oliveiras a cada 7 m (troncos esparsos para o LiDAR), solo com
# 2 a 3% de inclinação lateral (encosta acima é +y), um laço longo.
#
# Coordenadas no frame da partida (x ao longo das fileiras; o odom e o map
# nascem aí). No mundo, partida = (-36; -3,5), então mundo = frame + (-36; -3,5).
# Fileiras de oliveiras em y = -17,5, -10,5, -3,5, 3,5, 10,5, 17,5 e 24,5,
# com árvores de x = 4,5 a 67,5; entrelinhas em y = -14, -7, 0, 7, 14 e 21.
# Cabeceira oeste de x = -2 a 4 e leste de x = 68 a 74.
#
# Pontos a cada ~11 m: o costmap global é uma janela de 24 m centrada no
# robô, e o planejador recusa objetivos fora dela.
world: olive_grove.wbt
waypoints:
  - {name: y0_x11, x: 11.0, y: 0.0}
  - {name: y0_x22, x: 22.0, y: 0.0}
  - {name: y0_x33, x: 33.0, y: 0.0}
  - {name: y0_x44, x: 44.0, y: 0.0}
  - {name: y0_x55, x: 55.0, y: 0.0}
  - {name: y0_x66, x: 66.0, y: 0.0}
  - {name: cabeceira_leste_y0, x: 71.0, y: 0.0}
  - {name: cabeceira_leste_y7, x: 71.0, y: 7.0}
  - {name: y7_x60, x: 60.0, y: 7.0}
  - {name: y7_x49, x: 49.0, y: 7.0}
  - {name: y7_x38, x: 38.0, y: 7.0}
  - {name: y7_x27, x: 27.0, y: 7.0}
  - {name: y7_x16, x: 16.0, y: 7.0}
  - {name: y7_x5, x: 5.0, y: 7.0}
  - {name: partida, x: 0.0, y: 0.0}
