# slam_toolbox (SLAM 2D com o LiDAR frontal) do Agrobot no Webots.
# Usado pelo simulation.launch.py com slam:=true.
#
# Monta o /map e publica map -> odom (corrige a deriva do odom). A cada scan
# processado publica também /pose (PoseWithCovarianceStamped no frame map) com
# a covariância do scan matching: pequena na direção em que as paredes vistas
# prendem o robô, grande ao longo de uma parede reta, 500 m² sem nada no
# alcance. O ekf_map_node (config/ekf_map.yaml) funde essa pose com as rodas e
# o IMU; a elipse do RViz vem dele.
#
# Valores da versão 2.8.5 (Jazzy); os não listados ficam no padrão do pacote.

slam_toolbox:
  ros__parameters:
    use_sim_time: true

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # O padrão do pacote é base_footprint, que não existe no agrobot.urdf.
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # O slam_toolbox é o dono de map -> odom (o ekf_map_node não publica TF).
    transform_publish_period: 0.05
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    enable_interactive_mode: false
    use_map_saver: true
    stack_size_to_use: 40000000

    resolution: 0.05
    map_update_interval: 5.0
    # Alcance do LiDAR do agrobot.proto (maxRange 8 m).
    max_laser_range: 8.0

    # Quando processar um scan (e publicar /pose): a cada 0,2 m ou ~11° de
    # giro, no máximo a cada 0,25 s. Com o robô parado não processa, de
    # propósito: scans repetidos do mesmo lugar fariam a pose "andar" e a
    # elipse do EKF encolher sem informação nova. O "precisely" faz o giro
    # no lugar também contar.
    minimum_time_interval: 0.25
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    check_min_dist_and_heading_precisely: true

    # Scan matching (padrões). A covariância publicada em /pose sai daqui:
    # da busca de ±0,25 m em passos de 1 cm, com suavização de 0,1 m.
    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    position_covariance_scale: 1.0
    yaw_covariance_scale: 1.0

    # Fechamento de laço (padrões).
    do_loop_closing: true
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    min_pass_through: 2
    occupancy_threshold: 0.1
